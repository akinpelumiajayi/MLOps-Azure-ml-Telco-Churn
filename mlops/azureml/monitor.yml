$schema: http://azureml/sdk-2-0/Schedule.json
# Daily data drift + prediction drift check against the training data.
# The deploy workflow creates / updates this schedule after each rollout and
# points endpoint_deployment_id at the deployment now serving traffic.
name: diabetes-rf-monitor
display_name: diabetes-rf drift monitor
trigger:
  type: recurrence
  frequency: day
  interval: 1
  schedule:
    hours: 3
    minutes: 0
create_monitor:
  compute:
    instance_type: standard_e4s_v3
    runtime_version: "3.3"
  monitoring_target:
    ml_task: regression
    endpoint_deployment_id: azureml:placeholder-endpoint:blue
  monitoring_signals:
    data_drift:
      type: data_drift
      reference_data:
        input_data:
          path: azureml:diabetes-data@latest
          type: mltable
        data_context: training
        target_column_name: target
      features:
        top_n_feature_importance: 10
      metric_thresholds:
        numerical:
          jensen_shannon_distance: 0.1
    prediction_drift:
      type: prediction_drift
      reference_data:
        input_data:
          path: azureml:diabetes-data@latest
          type: mltable
        data_context: training
        target_column_name: target
      metric_thresholds:
        numerical:
          jensen_shannon_distance: 0.1
